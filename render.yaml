# Render deployment descriptor (optional but recommended).
# Pushing this repo to GitHub, then "New Web Service → use render.yaml" deploys the API.
# Set CORS_ORIGINS to your deployed frontend origin after the frontend is live.
services:
  - type: web
    name: climate-hazard-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: https://YOUR-FRONTEND-URL
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: climatehazard
